# Daily CI: unit + integration with mocks. No real API / e2e / H5.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # ASCII checkout path — FAISS can fail under non-ASCII workspace paths.
    defaults:
      run:
        working-directory: scenic

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: scenic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scenic/requirements.txt
            scenic/requirements-web.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-web.txt

      - name: Run unit + integration tests
        run: pytest tests/unit tests/integration -q
        env:
          # Ensure e2e / real API paths stay off even if someone adds markers later.
          RUN_E2E: ""
          SCENIC_EMBEDDING_MOCK: "1"
